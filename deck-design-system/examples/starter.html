<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck starter</title>
<link rel="stylesheet" href="../css/deck.css">
</head>
<body>
<div class="deck">

  <!-- Cover -->
  <section class="slide cover">
    <div class="centre">
      <div class="word">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="color:var(--accent)">
          <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="4"/>
          <path d="M20 34.5l8 8 16-18" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Brand</span>
      </div>
      <div class="tagline"><b>One short promise,</b><br>said in plain language</div>
    </div>
    <div class="meta"><i></i>Deck title · Month Year<i></i></div>
    <aside class="notes"><p>Opening line for the presenter.</p></aside>
  </section>

  <!-- Content template -->
  <section class="slide">
    <div class="hd">
      <h1 class="h">Headline goes here</h1>
      <p class="sub">One supporting sentence. Cut anything that does not earn the slide.</p>
    </div>
    <div class="ct">
      <!-- Pick a pattern from components.css / sample-deck.html -->
      <div class="callout band"><b>Replace this callout</b> with the pattern that fits the message.</div>
    </div>
    <footer class="foot">
      <span class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="color:var(--accent)">
          <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="4"/>
          <path d="M20 34.5l8 8 16-18" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Brand
      </span>
      <span class="pg num">02 / 02</span>
    </footer>
    <aside class="notes"><p>Speaker note for this slide.</p></aside>
  </section>

</div>
<div id="notesPanel"></div>
<script src="../js/deck.js"></script>
</body>
</html>
